<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录 · Agentic GenBI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #f5f5f2;
      font-family: ui-sans-serif, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #1e3a5f;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    /* ========== 卡片 ========== */
    .login-card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid rgba(30,58,95,.1);
      border-radius: 16px;
      padding: 44px 40px 36px;
      box-shadow: 0 24px 60px rgba(30,58,95,.10);
    }

    /* ========== brand ========== */
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #1e3a5f;
    }
    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2a4a73 100%);
      display: grid; place-items: center;
      color: #00d6b9;
      font-size: 12px;
      font-weight: 900;
    }

    /* ========== 标题 ========== */
    .title {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e3a5f;
      letter-spacing: -.01em;
    }
    .subtitle {
      margin: 0 0 28px;
      color: #6b7480;
      font-size: .82rem;
      line-height: 1.5;
    }

    /* ========== 飞书按钮（唯一入口） ========== */
    .feishu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #00d6b9;
      color: #fff;
      font: inherit;
      font-size: .88rem;
      font-weight: 800;
      cursor: pointer;
      transition: 200ms ease;
      box-shadow: 0 6px 18px rgba(0,214,185,.28);
    }
    .feishu-btn:hover {
      background: #00b8a0;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,214,185,.35);
    }
    .feishu-icon { width: 18px; height: 18px; }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="brand">
      <div class="brand-mark">G</div>
      <span>AGENTIC GENBI</span>
    </div>

    <h1 class="title">欢迎回来</h1>
    <p class="subtitle">使用飞书账号继续</p>

    <button class="feishu-btn" type="button">
      <svg class="feishu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 11.4c0-3.6-3.6-6.5-8-6.5s-8 2.9-8 6.5c0 3.2 2.8 5.9 6.6 6.4-.1.5-.4 1.7-.4 2 .1.4.3.4.5.3.2-.1 2.3-1.5 3.2-2.1 2-.2 3.7-1 5-2.2 1.4-1.3 2.1-2.9 2.1-4.4zm-9.7 2.5h-1.4c-.5 0-.9-.4-.9-.9s.4-.9.9-.9h1.4c.5 0 .9.4.9.9s-.4.9-.9.9zm5.3 0h-1.4c-.5 0-.9-.4-.9-.9s.4-.9.9-.9h1.4c.5 0 .9.4.9.9s-.4.9-.9.9zm-3.9-2.7c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm3.2 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9z"/></svg>
      飞书登录
    </button>

  </div>

</body>
</html>
