<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分析任务动态图标 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17365f;
      --muted: #7b8797;
      --line: rgba(23, 54, 95, .18);
      --coral: #ef6358;
      --paper: #fbfaf7;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(120deg, rgba(239,99,88,.08), transparent 34%),
        linear-gradient(180deg, #fff, #f5f7f8);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    main {
      width: min(1120px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      display: grid;
      gap: 10px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .demo {
      display: grid;
      align-content: start;
      gap: 18px;
      min-height: 260px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 18px 45px rgba(23,54,95,.08);
    }

    .icon-shell {
      display: grid;
      place-items: center;
      width: 82px;
      height: 82px;
      border: 1px solid rgba(239,99,88,.2);
      border-radius: 8px;
      background: var(--paper);
    }

    svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible;
    }

    h2 {
      margin: 0;
      font-size: 16px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .tag {
      justify-self: start;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(239,99,88,.1);
      color: var(--coral);
      font-size: 12px;
      font-weight: 700;
    }

    .scan-line {
      stroke: var(--coral);
      animation: scan 1.8s ease-in-out infinite;
    }

    .pulse-dot {
      fill: rgba(239,99,88,.18);
      stroke: var(--coral);
      transform-origin: 17px 17px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes scan {
      0%, 100% { transform: translateY(0); opacity: .35; }
      48% { transform: translateY(10px); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      48% { transform: scale(1.22); }
    }

    .question-card {
      transform-origin: 11px 12px;
      animation: lift 2s ease-in-out infinite;
    }

    .spark {
      stroke: var(--coral);
      animation: spark 2s ease-in-out infinite;
    }

    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes spark {
      0%, 35%, 100% { opacity: .35; transform: scale(.9); }
      52% { opacity: 1; transform: scale(1.1); }
    }

    .node {
      fill: #fff;
      stroke: var(--coral);
    }

    .n1 { animation: node-on 2.4s ease-in-out infinite; }
    .n2 { animation: node-on 2.4s ease-in-out .25s infinite; }
    .n3 { animation: node-on 2.4s ease-in-out .5s infinite; }
    .n4 { animation: node-on 2.4s ease-in-out .75s infinite; }

    @keyframes node-on {
      0%, 70%, 100% { fill: #fff; transform: scale(1); }
      28% { fill: rgba(239,99,88,.18); transform: scale(1.18); }
    }

    .bar {
      stroke: var(--coral);
      transform-box: fill-box;
      transform-origin: bottom;
      animation: grow 1.9s ease-in-out infinite;
    }

    .b2 { animation-delay: .14s; }
    .b3 { animation-delay: .28s; }

    @keyframes grow {
      0%, 100% { transform: scaleY(.35); opacity: .55; }
      45% { transform: scaleY(1); opacity: 1; }
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      main { width: min(100% - 28px, 1120px); padding: 32px 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>分析任务动态图标 Demo</h1>
      <p>这 4 个都可以放到左侧导航。鼠标不需要悬停，页面里直接循环展示动效。</p>
    </header>

    <section class="grid" aria-label="分析任务图标候选">
      <article class="demo">
        <div class="icon-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="16" rx="2.5" />
            <path d="M8.5 8h7M8.5 12h5.5M8.5 16h4" />
            <path class="scan-line" d="M7 6.5h10" />
            <circle class="pulse-dot" cx="17" cy="17" r="2.7" />
          </svg>
        </div>
        <span class="tag">Demo A</span>
        <h2>任务清单 + 扫描线</h2>
        <p>最像“Agent 正在推进一个分析任务”。稳，适合当前主导航。</p>
      </article>

      <article class="demo">
        <div class="icon-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect class="question-card" x="4.5" y="5" width="13" height="14" rx="2.5" />
            <path class="question-card" d="M8 10h5.5M8 14h4" />
            <path class="spark" d="M18 5.5v3M16.5 7h3M18.8 15.2l1.8 1.8M20.6 15.2l-1.8 1.8" />
          </svg>
        </div>
        <span class="tag">Demo B</span>
        <h2>问题卡片 + 洞察星点</h2>
        <p>更轻盈，有“问题转成洞察”的感觉，但业务系统里略活泼。</p>
      </article>

      <article class="demo">
        <div class="icon-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 7h7c2 0 3 1 3 3s-1 3-3 3H9c-2 0-3 1-3 3s1 3 3 3h9" />
            <circle class="node n1" cx="6" cy="7" r="2" />
            <circle class="node n2" cx="16" cy="10" r="2" />
            <circle class="node n3" cx="6" cy="16" r="2" />
            <circle class="node n4" cx="18" cy="19" r="2" />
          </svg>
        </div>
        <span class="tag">Demo C</span>
        <h2>路径节点 + 运行流</h2>
        <p>强调“分析路径”。如果你想突出可复用分析过程，这个最贴。</p>
      </article>

      <article class="demo">
        <div class="icon-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.8h8l4 4V20a1.8 1.8 0 0 1-1.8 1.8H6A1.8 1.8 0 0 1 4.2 20V5.6A1.8 1.8 0 0 1 6 3.8Z" />
            <path d="M14 4v4h4" />
            <path class="bar b1" d="M8 17v-3" />
            <path class="bar b2" d="M11 17v-6" />
            <path class="bar b3" d="M14 17v-4.5" />
          </svg>
        </div>
        <span class="tag">Demo D</span>
        <h2>文档 + 图表柱</h2>
        <p>偏“产出报告/资产”。更像分析资产库，不太像任务入口。</p>
      </article>
    </section>
  </main>
</body>
</html>
