name: agentic-genbi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-agentic_genbi}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-agentic_genbi}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-agentic_genbi_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-agentic_genbi} -d ${AUTH_POSTGRES_DB:-agentic_genbi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

  backend:
    image: agentic-genbi-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["python", "-m", "uvicorn", "backend.api.analysis_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      GENBI_BACKEND_WORKERS: "1"
      UVICORN_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      GENBI_CORS_ORIGINS: ${GENBI_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.101.12:3000}
      NEXT_PUBLIC_GENBI_API_BASE_URL: ${GENBI_PUBLIC_API_BASE_URL:-http://192.168.101.12:8000}
      GENBI_FINEREPORT_ROOT: ${GENBI_FINEREPORT_ROOT:-/app/资源库/finereport/报表画像}
      GENBI_DATABASE_URL: ${GENBI_DATABASE_URL:-postgresql://agentic_genbi:agentic_genbi_dev_password@postgres:5432/agentic_genbi?schema=public}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://agentic_genbi:agentic_genbi_dev_password@postgres:5432/agentic_genbi?schema=public}
      GENBI_PERSISTENCE: ${GENBI_PERSISTENCE:-postgres}
      GENBI_CODEX_HOME: ${GENBI_CODEX_HOME:-/app/.codex-home}
      GENBI_SYSTEM_API_TOKEN: ${GENBI_SYSTEM_API_TOKEN:-agentic-genbi-local-system-token-change-me}
      GENBI_MCP_ENCRYPTION_KEY: ${GENBI_MCP_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./资源库:/app/资源库:ro
      - ./.resource-index:/app/.resource-index
      - backend-codex-home:/app/.codex-home

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:migrate && NODE_ENV=production npm run build && mkdir -p .next/standalone/.next && cp -R .next/static .next/standalone/.next/static && cp -R public .next/standalone/public && HOSTNAME=0.0.0.0 PORT=3000 NODE_ENV=production node .next/standalone/server.js"]
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://agentic_genbi:agentic_genbi_dev_password@postgres:5432/agentic_genbi?schema=public}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-agentic-genbi-local-dev-secret-change-me}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      GENBI_BACKEND_INTERNAL_URL: http://backend:8000
      GENBI_SYSTEM_API_TOKEN: ${GENBI_SYSTEM_API_TOKEN:-agentic-genbi-local-system-token-change-me}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      NEXT_PUBLIC_API_BASE_URL: ${GENBI_PUBLIC_API_BASE_URL:-http://192.168.101.12:8000}
      NEXT_PUBLIC_GENBI_API_BASE_URL: ${GENBI_PUBLIC_API_BASE_URL:-http://192.168.101.12:8000}
      NEXT_PUBLIC_ANALYSIS_AGENT_RUNTIME: ${NEXT_PUBLIC_ANALYSIS_AGENT_RUNTIME:-backend}
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  auth-postgres-data:
  backend-codex-home:
