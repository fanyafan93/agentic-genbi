<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 C - 骨架等待切换</title>
  <style>
    :root{--accent:#ee6258;--ink:#18263b;--muted:#747c88;--line:#e7dfd8;--paper:#fffdfb;--wash:#f7f3ef;--deep:#243d61}
    *{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:var(--ink);font:15px/1.5 "Microsoft YaHei","Segoe UI",sans-serif}.top{height:68px;display:grid;grid-template-columns:220px 1fr 170px;align-items:center;padding:0 28px;background:#fbfaf8;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em;font-size:22px}.slogan{text-align:center;font-weight:900;letter-spacing:.28em;font-size:25px}.slogan span{color:var(--accent);font-style:italic}.user{justify-self:end;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:white}.shell{height:calc(100vh - 68px);display:grid;grid-template-columns:64px 300px 1fr;gap:4px;padding:0 4px 4px}.rail,.side,.main{background:var(--paper);border:1px solid var(--line)}.rail{border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:24px;padding-top:32px;color:#9aa0a6;font-size:22px}.rail .active{color:white;background:var(--accent);border-radius:14px;padding:12px}.side{border-radius:8px;padding:24px 18px;overflow:hidden}.kicker{color:var(--accent);letter-spacing:.24em;font-size:12px;font-weight:800}.side h1{margin:8px 0 22px;font-size:26px}.hint{color:var(--muted)}.new{width:100%;border:0;border-radius:8px;background:var(--accent);color:white;padding:13px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:22px -18px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{border:0;background:#fffaf7;padding:14px 8px;font-weight:800;color:#394254;cursor:pointer}.tabs button.active{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);background:#fff4f1}.task{width:100%;text-align:left;border:0;border-radius:8px;padding:14px;margin-bottom:10px;background:#fff;box-shadow:0 1px 0 #eee}.task strong{display:block}.task small{color:var(--muted)}.main{border-radius:8px;padding:22px 32px;overflow:hidden}.viewport{height:100%;max-width:980px;margin:0 auto;overflow:auto}.card{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(36,48,67,.08);overflow:hidden}.head{padding:30px 36px;border-bottom:1px solid var(--line)}.head h2{margin:8px 0 0;font-size:30px}.body{padding:28px 36px}.block{border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:16px;background:white}.grid{display:grid;grid-template-columns:240px 1fr 280px;gap:16px}.panel{border:1px solid var(--line);border-radius:9px;padding:18px;background:#fbfaf8}.skeleton .line,.skeleton .box{background:linear-gradient(90deg,#eee7df,#faf7f4,#eee7df);background-size:200% 100%;animation:shine 1.1s infinite linear;border-radius:8px}.skeleton .line{height:14px;margin:12px 0}.skeleton .line.short{width:46%}.skeleton .line.mid{width:72%}.skeleton .box{height:120px;margin:16px 0}.loading-title{display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse .8s infinite alternate}@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}@keyframes pulse{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}.note{position:fixed;right:24px;bottom:18px;background:var(--deep);color:white;border-radius:999px;padding:10px 16px;font-size:13px}
  </style>
</head>
<body>
  <header class="top"><div class="brand">AGENTIC GENBI</div><div class="slogan">MAKE <span>DATA</span> SENSE</div><div class="user">范佳录 · 用户</div></header>
  <div class="shell"><nav class="rail"><span>▦</span><span>☰</span><span class="active">⌕</span><span>⚙</span></nav><aside class="side"><span class="kicker">KNOWLEDGE EXPLORATION</span><h1>知识探索</h1><p class="hint">切换后先显示明确的等待状态。</p><button class="new">＋ 新建探索</button><div class="tabs"><button class="active" data-tab="explore">我的探索</button><button data-tab="resources">资源库</button><button data-tab="knowledge">知识库</button></div><button class="task"><strong>首购后 30 天复购率</strong><small>已完成</small></button><button class="task"><strong>推广费用</strong><small>待确认</small></button></aside><main class="main"><div class="viewport" id="viewport"></div></main></div>
  <div class="note">方案 C：切换时先给骨架屏，适合数据加载慢的模块</div>
  <script>
    const titles={explore:["EXPLORATION PROCESS","首购后 30 天复购率"],resources:["RESOURCE LIBRARY","资源库"],knowledge:["KNOWLEDGE BASE","知识库"]};
    const content={explore:`<div class="block"><h3>探索进展</h3><p>已检索资源库、查看表结构，并整理出需要确认的口径分支。</p></div><div class="block"><h3>探索结论</h3><p>当前只能说明剃须刀专用品类有现成实现。</p></div>`,resources:`<div class="grid"><aside class="panel"><strong>资源列表</strong><p>推广总览明细表.cpt</p><p>库存统计报表.cpt</p></aside><section class="block"><h3>结构摘要</h3><p>参数、读表、字段候选和表达式候选。</p></section><aside class="panel"><strong>证据片段</strong><p>受控片段读取，不展示完整正文。</p></aside></div>`,knowledge:`<div class="grid"><aside class="panel"><strong>分类</strong><p>指标定义 / 字段映射 / 报表逻辑</p></aside><section><div class="block"><h3>毛利率计算口径</h3><p>已认证，Agent 可检索。</p></div><div class="block"><h3>收入净额字段映射</h3><p>待财务确认。</p></div></section><aside class="panel"><strong>详情</strong><p>版本、认证、标签、使用记录。</p></aside></div>`};
    const viewport=document.getElementById("viewport");
    function skeleton(id){const [k,t]=titles[id];viewport.innerHTML=`<article class="card skeleton"><header class="head"><span class="kicker">${k}</span><h2>${t}</h2></header><div class="body"><div class="loading-title">正在进入${t}<span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="line mid"></div><div class="line"></div><div class="box"></div><div class="line short"></div><div class="line mid"></div></div></article>`}
    function render(id){const [k,t]=titles[id];viewport.innerHTML=`<article class="card"><header class="head"><span class="kicker">${k}</span><h2>${t}</h2></header><div class="body">${content[id]}</div></article>`}
    function switchTo(id){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));skeleton(id);setTimeout(()=>render(id),520)}
    document.querySelectorAll(".tabs button").forEach(button=>button.addEventListener("click",()=>switchTo(button.dataset.tab)));render("explore");
  </script>
</body>
</html>
