[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-genbi-backend"
version = "0.1.0"
description = "Agentic GenBI MVP FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.0",
    "openai-agents==0.18.2",
    "pydantic-settings==2.14.2",
    "pymysql[rsa]==1.1.1",
    "sqlalchemy==2.0.41",
    "sqlglot==30.12.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires the local Docker MySQL test service",
    "live_agent: requires RUN_LIVE_AGENT_SMOKE_TEST=true and a valid MiniMax API key",
]
